<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Coach — Learn as you play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-glyph">♞</span>
    <div class="brand-text">
      <h1>Chess Coach</h1>
      <p>Learn the <em>why</em> behind every move</p>
    </div>
  </div>

  <div class="controls">
    <label class="control">
      <span>Opponent strength</span>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="newGameBtn" class="btn btn-ghost">New game</button>
  </div>
</header>

<main class="layout">

  <section class="board-column">
    <div class="board-status" id="boardStatus">Your move — White</div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="captured-row">
      <div class="captured-group">
        <span class="captured-label">You've captured</span>
        <div class="captured-pieces" id="capturedByWhite"></div>
      </div>
      <div class="captured-group">
        <span class="captured-label">Opponent's captured</span>
        <div class="captured-pieces" id="capturedByBlack"></div>
      </div>
    </div>
  </section>

  <aside class="notebook">
    <div class="notebook-head">
      <span class="notebook-icon">✎</span>
      <h2>Coach's notebook</h2>
    </div>
    <div class="notebook-page" id="chatLog"></div>
    <button id="hintBtn" class="btn btn-gold">Suggest a move</button>
  </aside>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <p id="modalText">Game over</p>
    <button id="modalCloseBtn" class="btn btn-gold">New game</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
